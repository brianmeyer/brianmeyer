<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
  <title id="title">Autonomous AI System Architecture</title>
  <desc id="desc">A blueprint-style architecture showing perception, reasoning, memory, planning, tool use, action, and deployment.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#17314f" stroke-width="1" opacity="0.35"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06101c"/>
      <stop offset="1" stop-color="#0a1726"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .label{font:600 22px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px;fill:#dbeafe}
      .small{font:500 14px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px;fill:#7dd3fc}
      .tiny{font:500 12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.8px;fill:#93a4b8}
      .title{font:700 38px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:3px;fill:#f8fafc}
      .node{fill:#091522;stroke-width:2;rx:16}
      .line{stroke:#7dd3fc;stroke-width:2;fill:none;opacity:.8}
      .dash{stroke-dasharray:7 7;opacity:.55}
    </style>
  </defs>
  <rect width="1500" height="500" fill="url(#bg)"/>
  <rect width="1500" height="500" fill="url(#grid)"/>
  <rect x="18" y="18" width="1464" height="464" rx="18" fill="none" stroke="#29435f"/>

  <text x="60" y="78" class="title">AUTONOMOUS AI SYSTEM ARCHITECTURE</text>
  <text x="62" y="112" class="small">DESIGNED TO REMEMBER • REASON • ACT • DEPLOY</text>

  <g transform="translate(70 178)">
    <g>
      <rect class="node" x="0" y="0" width="155" height="150" stroke="#60a5fa"/>
      <circle cx="77" cy="48" r="18" fill="none" stroke="#60a5fa" stroke-width="2"/>
      <circle cx="77" cy="48" r="5" fill="#60a5fa"/>
      <text x="77" y="98" text-anchor="middle" class="label">PERCEPTION</text>
      <text x="77" y="123" text-anchor="middle" class="tiny">vision · audio · text</text>
    </g>
    <g>
      <rect class="node" x="190" y="0" width="155" height="150" stroke="#c084fc"/>
      <path d="M240 55c0-18 14-31 31-31 16 0 28 9 31 24 12 1 21 10 21 23 0 14-11 25-25 25h-31c-15 0-27-12-27-27 0-6 2-10 5-14z" fill="none" stroke="#c084fc" stroke-width="2"/>
      <text x="267" y="98" text-anchor="middle" class="label">REASONING</text>
      <text x="267" y="123" text-anchor="middle" class="tiny">local models · inference</text>
    </g>
    <g>
      <rect class="node" x="380" y="0" width="155" height="150" stroke="#86efac"/>
      <ellipse cx="430" cy="45" rx="22" ry="10" fill="none" stroke="#86efac" stroke-width="2"/>
      <path d="M408 45v36c0 6 10 10 22 10s22-4 22-10V45" fill="none" stroke="#86efac" stroke-width="2"/>
      <circle cx="482" cy="54" r="8" fill="none" stroke="#86efac" stroke-width="2"/>
      <circle cx="505" cy="78" r="8" fill="none" stroke="#86efac" stroke-width="2"/>
      <path d="M452 67h22l8-13m8 8 9 10" fill="none" stroke="#86efac" stroke-width="2"/>
      <text x="457" y="98" text-anchor="middle" class="label">MEMORY</text>
      <text x="457" y="123" text-anchor="middle" class="tiny">retrieval · knowledge</text>
    </g>
    <g>
      <rect class="node" x="570" y="0" width="155" height="150" stroke="#60a5fa"/>
      <rect x="626" y="34" width="42" height="24" rx="5" fill="none" stroke="#60a5fa" stroke-width="2"/>
      <circle cx="607" cy="84" r="8" fill="none" stroke="#60a5fa" stroke-width="2"/>
      <circle cx="648" cy="84" r="8" fill="none" stroke="#60a5fa" stroke-width="2"/>
      <circle cx="689" cy="84" r="8" fill="none" stroke="#60a5fa" stroke-width="2"/>
      <path d="M647 58v16m-40 2h82" stroke="#60a5fa" stroke-width="2"/>
      <text x="647" y="118" text-anchor="middle" class="label">PLANNING</text>
    </g>
    <g>
      <rect class="node" x="760" y="0" width="155" height="150" stroke="#facc15"/>
      <path d="M808 42l18 18-34 34-18-18zm32 20 22-22m-3 3 12 12" fill="none" stroke="#facc15" stroke-width="3"/>
      <text x="837" y="98" text-anchor="middle" class="label">TOOL USE</text>
      <text x="837" y="123" text-anchor="middle" class="tiny">APIs · services · workflows</text>
    </g>
    <g>
      <rect class="node" x="950" y="0" width="155" height="150" stroke="#f59e0b"/>
      <path d="M1000 85l28-28 20 20-28 28h-20zm28-28V35h25v22" fill="none" stroke="#f59e0b" stroke-width="3"/>
      <text x="1027" y="118" text-anchor="middle" class="label">ACTION</text>
    </g>
    <g>
      <rect class="node" x="1140" y="0" width="155" height="150" stroke="#f97316"/>
      <path d="M1183 60c4-17 18-28 36-28 16 0 30 9 35 24 15 1 26 12 26 27 0 16-12 28-29 28h-51c-18 0-32-13-32-30 0-10 5-18 15-21z" fill="none" stroke="#f97316" stroke-width="2"/>
      <path d="M1198 76h54m-54 14h54" stroke="#f97316" stroke-width="2"/>
      <text x="1217" y="118" text-anchor="middle" class="label">DEPLOYMENT</text>
    </g>

    <g class="line" filter="url(#glow)">
      <path d="M155 75h35"/><path d="M345 75h35"/><path d="M535 75h35"/><path d="M725 75h35"/><path d="M915 75h35"/><path d="M1105 75h35"/>
      <path d="M184 69l6 6-6 6M374 69l6 6-6 6M564 69l6 6-6 6M754 69l6 6-6 6M944 69l6 6-6 6M1134 69l6 6-6 6"/>
    </g>
    <path class="line dash" d="M1217 150v45H77v-45"/>
  </g>

  <g transform="translate(70 390)">
    <text x="0" y="0" class="small">IMPLEMENTATIONS</text>
    <text x="0" y="32" class="tiny">Molly</text>
    <text x="170" y="32" class="tiny">TinyLLM / DistillReasoning</text>
    <text x="445" y="32" class="tiny">RecallForge / MollyGraph</text>
    <text x="760" y="32" class="tiny">Reachy Mini</text>
    <text x="980" y="32" class="tiny">Databricks</text>
  </g>

  <g transform="translate(1230 54)">
    <rect width="220" height="96" fill="#07111d" stroke="#29435f"/>
    <text x="14" y="24" class="tiny">DOCUMENT  AAS-ARCH-001</text>
    <text x="14" y="49" class="tiny">REVISION  1.0</text>
    <text x="14" y="74" class="tiny">STATUS    ACTIVE</text>
  </g>

  <text x="1270" y="454" class="tiny">BRIAN MEYER · DEPLOYMENT STRATEGIST</text>
</svg>