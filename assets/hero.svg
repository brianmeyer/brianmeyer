<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
<title id="title">Autonomous AI System Architecture</title>
<desc id="desc">Blueprint-style architecture banner showing perception, reasoning, memory, planning, tool use, action, and deployment.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030b14"/><stop offset="1" stop-color="#071727"/></linearGradient>
