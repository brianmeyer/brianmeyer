  <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .title{font-size:34px;font-weight:700;letter-spacing:5px;fill:#f2f7ff}
    .sub{font-size:13px;letter-spacing:3px;fill:#72b7ff}
    .kicker{font-size:11px;letter-spacing:2px;fill:#8ea2b8}
    .stage{font-size:17px;font-weight:700;letter-spacing:1px;fill:#edf5ff}
    .micro{font-size:10px;letter-spacing:1px;fill:#8fa4b8}
    .impl{font-size:12px;font-weight:700;letter-spacing:1px}
    .box{fill:#071523;stroke-width:1.5}
    .wire{fill:none;stroke:#9bb4c9;stroke-width:1.4;opacity:.8}
  </style>
</defs>
<rect width="1500" height="500" fill="url(#bg)"/>
<rect width="1500" height="500" fill="url(#grid)"/>
